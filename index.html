<script>
const pages={
 inicio:{title:'O Poder da Dessalinização no <span>Futuro Hídrico de Alagoas</span>',desc:'Uma investigação iniciada na escola pública, a partir de desafios locais de abastecimento, com estudos, maquetes e testes de um protótipo de dessalinização.',kicker:'CIÊNCIA NA ESCOLA PÚBLICA • PESQUISA EM ANDAMENTO',body:`<section class="section"><div class="container"><div class="section-head center"><span class="eyebrow">CONHEÇA A PESQUISA</span><h2><span class="dark-heading">Da realidade local à</span> <span>investigação científica</span></h2><p>A pesquisa foi iniciada na Escola Estadual Dr. Sidrônio Augusto de Santa Maria, em Santa Luzia do Norte (AL). Foram preparados materiais para a XI Mostra Científica e aprofundados estudos sobre um protótipo compacto.</p></div><div class="cards"><a class="card reveal" href="#origem"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg></div><h3>A origem do projeto</h3><p>Foi observada a instabilidade no abastecimento local, que motivou a escolha do tema e o início das investigações.</p></a><a class="card reveal" href="#objetivo"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></div><h3>Objetivo da pesquisa</h3><p>Foram definidos objetivos voltados à dessalinização e às diferentes realidades hídricas de Alagoas.</p></a><a class="card reveal" href="#prototipo"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4l.6 2.3 2 1.1 2.2-.8 2 3.5-1.7 1.7v2.4l1.7 1.7-2 3.5-2.2-.8-2 1.1L14 21h-4l-.6-2.3-2-1.1-2.2.8-2-3.5 1.7-1.7v-2.4L3.2 9l2-3.5 2.2.8 2-1.1z"/><circle cx="12" cy="12" r="3"/></svg></div><h3>Protótipo experimental</h3><p>Foram planejadas etapas de pré-tratamento e separação para o protótipo em escala reduzida.</p></a></div></div></section><section class="section soft"><div class="container two"><div class="content"><span class="eyebrow">UMA PESQUISA EM CONSTRUÇÃO</span><h2>Aprender também é <span>testar, avaliar e melhorar.</span></h2><p>Durante a montagem, foram realizados testes e identificadas dificuldades no fluxo de água e na regulagem do sistema. Esses desafios orientaram novos ajustes; a pesquisa continua em desenvolvimento.</p><a class="btn primary" href="#testes">Acompanhe o estágio atual ↗</a></div><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 5 5m-3-7 7 7-3 3-7-7zM12 12l-3 3m6-4 2 2a6 6 0 0 1-6 8H4m1-4h6"/></svg></span><h3>Conhecimento que nasce na escola pública de Alagoas.</h3><p>Foram reunidos estudos, representações didáticas e experimentos para aproximar a ciência dos desafios locais.</p></div></div></section><section class="section"><div class="container band"><div><h2>O próximo passo é continuar pesquisando.</h2><p>Foram registrados aqui a origem da pesquisa, os objetivos, as apresentações, a montagem do protótipo e as próximas etapas.</p></div><a class="btn primary" href="#futuro">Veja os próximos passos ↗</a></div></section>`},
 origem:{title:'A origem do <span>projeto</span>',desc:'Uma questão da realidade local se transformou em ponto de partida para uma investigação científica desenvolvida por estudantes.',kicker:'COMO TUDO COMEÇOU',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">O CONTEXTO</span><h2>Da sala de aula para a <span>pesquisa científica.</span></h2><p>O estudo “O Poder da Dessalinização no Futuro Hídrico de Alagoas” foi iniciado na Escola Estadual Dr. Sidrônio Augusto de Santa Maria, em Santa Luzia do Norte (AL). A proposta foi organizada para a XI Mostra Científica e ampliada com novas etapas experimentais.</p><p>Foram observados problemas de escassez e interrupção no abastecimento de água que afetam a rotina escolar e a comunidade. A partir dessa realidade, foi escolhida a dessalinização como tema de investigação científica.</p><p>Foi realizado um levantamento sobre a dessalinização e suas aplicações em Alagoas. O desafio local foi transformado em uma pergunta de pesquisa, buscando relacionar conhecimentos de Química, tecnologia e sustentabilidade.</p></div><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6M9 10h.01M15 10h.01"/></svg></span><h3>Uma ideia que começou na escola pública.</h3><p>Escola Estadual Dr. Sidrônio Augusto de Santa Maria<br>Santa Luzia do Norte — Alagoas</p></div></div></section><section class="section soft"><div class="container"><div class="section-head"><span class="eyebrow">NOSSA MOTIVAÇÃO</span><h2>Transformar um desafio em <span>pergunta de pesquisa.</span></h2><p>A investigação partiu da realidade vivenciada na escola. Foram estudados processos empregados em usinas e planejada sua representação por meio de materiais didáticos e um sistema experimental reduzido.</p></div><div class="cards"><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg></div><h3>Observar</h3><p>Foram identificados desafios relacionados à escassez e à instabilidade do abastecimento de água.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-3-2-6-2-9-1v13c3-1 6-1 9 1 3-2 6-2 9-1V6c-3-1-6-1-9 1zM12 7v13"/></svg></div><h3>Investigar</h3><p>Foram pesquisadas tecnologias de dessalinização e seus princípios físico-químicos.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v7l-5.5 8.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 10V3M8 15h8"/></svg></div><h3>Experimentar</h3><p>Foi montado um modelo experimental em escala reduzida para apoiar os estudos e os testes.</p></article></div></div></section>`},
 objetivo:{title:'Por que estudar a <span>dessalinização?</span>',desc:'Objetivo da pesquisa: investigar a dessalinização como possível alternativa estratégica para o futuro hídrico de Alagoas.',kicker:'DEMOCRATIZANDO A CIÊNCIA DO FUTURO',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">OBJETIVO PRINCIPAL</span><h2>Estudar uma tecnologia e aproximá-la da <span>realidade local.</span></h2><p>Foi estabelecido como objetivo estudar a importância da dessalinização para a segurança hídrica de Alagoas, considerando águas salobras do interior e possibilidades de tratamento de água do mar no litoral.</p><p>Foram pesquisadas usinas e tecnologias utilizadas em outras regiões. Em seguida, foi levantada uma questão central: como representar esses processos de modo acessível à realidade escolar e local?</p><p>Foram preparadas maquetes para explicar a evolução histórica do tratamento de água e um protótipo em escala reduzida para investigar, na prática, as etapas de filtragem e dessalinização.</p></div><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span><h3>Ciência acessível, pesquisa aplicada e inovação.</h3><p>Foi adotada a escala reduzida para estudar conceitos de Química e desafios técnicos, sem reproduzir a capacidade de uma usina industrial.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head center"><span class="eyebrow">FOCO DA INVESTIGAÇÃO</span><h2>O que o projeto pretende <span>explorar?</span></h2></div><div class="cards"><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8c2 0 2 2 5 2s3-2 5-2 3 2 5 2 3-2 5-2M2 14c2 0 2 2 5 2s3-2 5-2 3 2 5 2 3-2 5-2M2 20c2 0 2 2 5 2s3-2 5-2 3 2 5 2 3-2 5-2"/></svg></div><h3>Contextos de aplicação</h3><p>Foram considerados os poços de água salobra do interior e as demandas de abastecimento das regiões litorâneas.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3h4l.6 2.3 2 1.1 2.2-.8 2 3.5-1.7 1.7v2.4l1.7 1.7-2 3.5-2.2-.8-2 1.1L14 21h-4l-.6-2.3-2-1.1-2.2.8-2-3.5 1.7-1.7v-2.4L3.2 9l2-3.5 2.2.8 2-1.1z"/><circle cx="12" cy="12" r="3"/></svg></div><h3>Escala reduzida</h3><p>Foi preparada uma montagem experimental para investigar os princípios de tratamento e separação.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6m-5 3h4m-5-6c-2-1.3-3-3-3-5a6 6 0 0 1 12 0c0 2-1 3.7-3 5l-1 3h-4z"/></svg></div><h3>Inovação própria</h3><p>Foi proposta para estudos futuros a investigação de materiais alternativos para uma membrana própria.</p></article></div><div class="note"><strong>Importante:</strong> a viabilidade para uso real depende de resultados experimentais, análise da qualidade da água, custos, consumo energético, manutenção e avaliação ambiental.</div></div></section>`},
 prototipo:{title:'Conheça o <span>protótipo experimental</span>',desc:'Etapas planejadas, montadas e estudadas durante o desenvolvimento do protótipo experimental.',kicker:'DA TEORIA À EXPERIMENTAÇÃO',body:`<section class="section"><div class="container"><div class="section-head"><span class="eyebrow">ETAPAS INTEGRADAS</span><h2>Como o sistema foi <span>montado e estudado?</span></h2><p>Foi estruturada uma sequência de pré-filtragem com materiais acessíveis e estudada sua integração à osmose reversa. O processo permanece sujeito a testes e ajustes.</p></div><div class="steps"><article class="step"><span class="num">01</span><div><h3>Pré-tratamento físico e adsortivo</h3><p>Foram organizadas etapas de filtragem com areia, brita, algodão e carvão ativado. Foi previsto o uso de uma bomba para conduzir a água pelo sistema.</p></div></article><article class="step"><span class="num">02</span><div><h3>Função do carvão ativado</h3><p>Foi utilizado o carvão ativado como material adsorvente para auxiliar na retenção de alguns compostos orgânicos e odores. Foi estudado também que essa etapa não remove, por si só, os sais dissolvidos.</p></div></article><article class="step"><span class="num">03</span><div><h3>Separação por osmose reversa</h3><p>Foi estudada a aplicação de pressão para fazer a água atravessar uma membrana semipermeável. A separação de sais por osmose reversa integra a proposta técnica do protótipo.</p></div></article><article class="step"><span class="num">04</span><div><h3>Estudo e observação</h3><p>Foram observadas dificuldades na passagem contínua da água pelas camadas filtrantes. Foram necessários ajustes na montagem, no bombeamento e nas condições de operação.</p></div></article></div><div class="note"><strong>Nota técnica:</strong> a filtragem com areia, brita, algodão e carvão ativado não remove, por si só, os sais dissolvidos. A dessalinização depende da etapa apropriada de separação. Água produzida por um protótipo não deve ser considerada potável sem análises laboratoriais e tratamento validado.</div></div></section><section class="section soft"><div class="container two"><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v7l-5.5 8.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 10V3M8 15h8"/></svg></span><h3>Um protótipo para aprender com os desafios reais da engenharia.</h3><p>Modelo experimental em fase de testes e aprimoramento laboratorial.</p></div><div class="content"><span class="eyebrow">PESQUISA EM ANDAMENTO</span><h2>O protótipo é parte do <span>processo de aprendizagem.</span></h2><p>Com a montagem em escala reduzida, foram observadas limitações práticas e identificadas melhorias a serem investigadas nos próximos testes.</p><a class="btn primary" href="#testes">Ver estágio atual ↗</a></div></div></section><section class="section soft"><div class="container"><div class="section-head center"><span class="eyebrow">REGISTRO FOTOGRÁFICO DO PROTÓTIPO</span><h2>O sistema durante o <span>desenvolvimento</span></h2><p>Foram utilizados registros apresentados nos trabalhos da XI Mostra Científica e do InovaEDU. As imagens documentam a montagem experimental, sem representar comprovação de potabilidade.</p></div><div class="proto-gallery"><figure class="proto-photo"><img src="imagens_prototipo/prototipo_compacto.jpg" alt="Protótipo compacto de dessalinização com componentes e conexões sobre o piso" loading="lazy"><figcaption><strong>Protótipo compacto</strong>Fotografia apresentada no resumo expandido do InovaEDU, mostrando a proposta em escala reduzida.</figcaption></figure><figure class="proto-photo"><img src="imagens_prototipo/teste_prototipo_1.jpg" alt="Registro do sistema de filtragem em fase de experimentação" loading="lazy"><figcaption><strong>Montagem experimental</strong>Registro do artigo da XI Mostra Científica, durante as fases de testes do sistema de filtragem.</figcaption></figure></div></div></section>`},
 testes:{title:'Um projeto em <span>fase de testes</span>',desc:'Estágio atual, desafios técnicos e aprimoramento do protótipo.',kicker:'TRANSPARÊNCIA CIENTÍFICA',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">ESTÁGIO ATUAL</span><h2>Testar, compreender e <span>aprimorar.</span></h2><p>Foram realizados testes iniciais com o protótipo e identificadas dificuldades no bombeamento contínuo, na passagem pelas camadas de areia e carvão ativado e no controle do fluxo entre os módulos.</p><p>Foram feitos ajustes nas conexões e no percurso da água. Essas tentativas permitiram compreender melhor as limitações hidráulicas de um sistema em escala reduzida.</p><p>A continuidade dos testes foi mantida como uma etapa necessária para avaliar o desempenho do protótipo. Não foi estabelecida, até aqui, comprovação laboratorial de potabilidade.</p></div><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 5 5m-3-7 7 7-3 3-7-7zM12 12l-3 3m6-4 2 2a6 6 0 0 1-6 8H4m1-4h6"/></svg></span><h3>O resultado de um teste também é conhecimento.</h3><p>Observar limitações ajuda a orientar os próximos passos da pesquisa.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head center"><span class="eyebrow">PONTOS DE ATENÇÃO IDENTIFICADOS</span><h2>Desafios técnicos em <span>investigação</span></h2><p>Foram identificados durante as etapas de montagem e experimentação os seguintes pontos de atenção.</p></div><div class="cards"><article class="card"><div class="icon">〰️</div><h3>Dinâmica hidráulica</h3><p>Foram observadas dificuldades para manter o fluxo contínuo entre as etapas de filtragem.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="9" cy="5" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"/><circle cx="10" cy="19" r="2" fill="currentColor" stroke="none"/></svg></div><h3>Calibração das pressões</h3><p>Foram realizados ajustes de bombeamento, pressão e gravidade para reduzir interrupções e vazamentos.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8M8 16h8"/></svg></div><h3>Registro dos testes</h3><p>Foram registradas dificuldades e propostas de melhoria; novos resultados dependerão de testes posteriores.</p></article></div><div class="note"><strong>Espaço para futuras atualizações:</strong> adicione aqui datas dos testes, fotografias do protótipo, medições, tabelas de resultados e conclusões confirmadas pela equipe.</div></div></section><section class="section"><div class="container"><div class="section-head center"><span class="eyebrow">IMAGENS DOS TESTES</span><h2>Registros das <span>etapas experimentais</span></h2><p>Foram registradas diferentes configurações do protótipo durante os testes iniciais, conforme o artigo da XI Mostra Científica.</p></div><div class="proto-gallery"><figure class="proto-photo"><img src="imagens_prototipo/teste_prototipo_1.jpg" alt="Primeira fotografia dos testes com recipientes e tubulações do protótipo" loading="lazy"><figcaption><strong>Primeiro registro dos testes</strong>Montagem experimental com recipientes conectados para observar o percurso da água.</figcaption></figure><figure class="proto-photo"><img src="imagens_prototipo/teste_prototipo_2.jpg" alt="Segunda fotografia dos testes do protótipo de filtragem e dessalinização" loading="lazy"><figcaption><strong>Segundo registro dos testes</strong>Outra configuração do sistema experimental, documentada durante a investigação.</figcaption></figure></div><div class="note"><strong>Sobre as fotografias:</strong> foram extraídas dos artigos enviados, sem incluir as maquetes históricas ou da estação de tratamento. As imagens não substituem medições laboratoriais da qualidade da água.</div></div></section>`},
 futuro:{title:'O futuro da pesquisa <span>continua em construção.</span>',desc:'Perspectivas futuras do projeto de dessalinização.',kicker:'NOSSA PRÓXIMA FRONTEIRA',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">PLANOS FUTUROS</span><h2>Pesquisar novas possibilidades com <span>autonomia tecnológica.</span></h2><p>Como etapa futura, foi proposta a pesquisa de uma membrana própria de osmose reversa a partir de materiais alternativos e polímeros acessíveis.</p><p>Foi definida como meta a investigação de alternativas que possam reduzir custos e ampliar a autonomia tecnológica da pesquisa.</p><p>Essa possibilidade ainda não foi executada nem validada. Para avançar, serão necessários experimentos controlados, avaliação de retenção de sais e análises da qualidade da água.</p></div><div class="panel"><span class="symbol"><svg class="site-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16c1-5 6-11 15-13-1 9-8 14-13 15zM8 12l4 4M6 16l-3 5 5-3M14 6l4 4"/></svg></span><h3>Inovação científica que pode nascer na escola pública.</h3><p>Foi proposta uma nova linha de investigação, cuja viabilidade deverá ser verificada experimentalmente.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head"><span class="eyebrow">CAMINHOS DE INVESTIGAÇÃO</span><h2>O que pode ser desenvolvido <span>nas próximas etapas?</span></h2><p>Foram selecionadas frentes de estudo para orientar o desenvolvimento futuro da pesquisa.</p></div><div class="steps"><article class="step"><span class="num">01</span><div><h3>Pesquisa de materiais</h3><p>Foi proposta a investigação de polímeros e outros materiais passíveis de avaliação experimental.</p></div></article><article class="step"><span class="num">02</span><div><h3>Desenvolvimento experimental</h3><p>Foi previsto o planejamento de amostras e de procedimentos para novos testes.</p></div></article><article class="step"><span class="num">03</span><div><h3>Avaliação de desempenho</h3><p>Foi prevista a comparação controlada de vazão, retenção de sais e durabilidade.</p></div></article><article class="step"><span class="num">04</span><div><h3>Viabilidade e segurança</h3><p>Foi considerada a necessidade de avaliar custos, consumo energético, manutenção e segurança da água.</p></div></article></div><div class="note"><strong>Próxima atualização:</strong> adicione aqui os resultados reais quando houver novos testes, fotografias, dados e conclusões validadas pela equipe.</div></div></section>`},
 mostra:{title:'XI Mostra <span>Científica</span>',desc:'Na XI Mostra Científica de 2026, foram apresentados modelos didáticos e um estudo sobre o tratamento de água e a dessalinização.',kicker:'PESQUISA • QUÍMICA • EDUCAÇÃO CIENTÍFICA',body:`<section class="section"><div class="container"><div class="section-head"><span class="eyebrow">O ESTUDO</span><h2>O poder da dessalinização no <span>futuro hídrico de Alagoas</span></h2><p>Foi realizada uma revisão bibliográfica sobre o abastecimento de água em Alagoas, com atenção ao Semiárido. Para a apresentação, foram construídas maquetes e preparada uma demonstração didática de processos físico-químicos.</p></div><div class="cards"><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 19h18M5 19V9l7-5 7 5v10M9 19v-5h6v5"/></svg></div><h3>Evolução do tratamento</h3><p>Foram construídas duas maquetes: uma representando métodos antigos de obtenção de água e outra ilustrando uma Estação de Tratamento de Água (ETA) convencional.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2h8M10 2v7l-6 9a3 3 0 0 0 2.5 4h11a3 3 0 0 0 2.5-4l-6-9V2M7 16h10"/></svg></div><h3>Experimento didático</h3><p>Foi preparado um experimento para representar a pré-filtragem e o princípio da osmose reversa. Também foi produzida uma animação de aproximadamente quatro minutos e meio para apoiar a explicação.</p></article><article class="card"><div class="icon"><svg class="site-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V5m0 14h17M8 15l4-4 3 2 5-7"/></svg></div><h3>Resultados e desafios</h3><p>Foram observados ganhos na apresentação didática dos conceitos e dificuldades na continuidade do fluxo, no bombeamento e no ajuste das camadas filtrantes.</p></article></div></div></section><section class="section soft"><div class="container two"><div class="content"><span class="eyebrow">O QUE FOI ESTUDADO</span><h2>Conhecimento científico <span>aplicado à escola</span></h2><p>Foram estudadas a salinidade, os sólidos dissolvidos, a condutividade elétrica e a dureza da água. Também foi discutida a necessidade de destinar corretamente o rejeito salino.</p><p>Foi adotado um objetivo didático para a demonstração. Não foi comprovada a potabilidade da água apenas pela apresentação experimental.</p></div><div class="panel"><h3>Leia o artigo completo</h3><p>Projeto de pesquisa para a XI Mostra Científica • Química • Junho de 2026.</p><a class="btn primary" href="artigo-mostra-cientifica.pdf" download="Artigo-XI-Mostra-Cientifica.pdf">Baixar artigo em PDF ↓</a><p><a href="artigo-mostra-cientifica.pdf" target="_blank" rel="noopener">Abrir o artigo no navegador ↗</a></p></div></div></section>`},
 inovaedu:{title:'InovaEDU <span>2026</span>',desc:'Foi elaborada uma proposta compacta e descentralizada, com planejamento técnico e testes em andamento.',kicker:'INOVAÇÃO • TECNOLOGIA • SUSTENTABILIDADE',body:`<section class="section"><div class="container"><div class="section-head"><span class="eyebrow">PROPOSTA DE INOVAÇÃO</span><h2>Dessalinização em <span>microescala</span></h2><p>Foi desenvolvida uma proposta de sistema modular e compacto para estudar o tratamento de água salobra. Foram consideradas aplicações futuras em escolas e pequenas comunidades, em conexão com a realidade de Santa Luzia do Norte (AL).</p></div><div class="steps"><article class="step"><span class="num">01</span><div><h3>Captação e pré-filtragem</h3><p>Foram organizados três módulos de pré-filtragem com brita, areia, algodão e carvão ativado. Foi estudado que essas camadas reduzem partículas e alguns compostos, mas não removem os sais dissolvidos.</p></div></article><article class="step"><span class="num">02</span><div><h3>Reservatório intermediário</h3><p>Foi previsto um reservatório intermediário para receber a água após a pré-filtragem e alimentar a etapa seguinte.</p></div></article><article class="step"><span class="num">03</span><div><h3>Osmose reversa</h3><p>Foi prevista uma bomba de pressurização associada à membrana semipermeável, com separação entre o permeado e o rejeito salino. O desempenho ainda depende de validação experimental.</p></div></article><article class="step"><span class="num">04</span><div><h3>Testes e próximos estudos</h3><p>Foram iniciados testes e ajustes do protótipo. Para as próximas etapas, foram propostos estudos do desempenho, do destino do rejeito e de membranas alternativas.</p></div></article></div><div class="note"><strong>Importante:</strong> o documento apresenta estimativas e perspectivas de desempenho, não uma certificação de água potável. O consumo humano exige validação laboratorial físico-química e microbiológica.</div></div></section><section class="section soft"><div class="container two"><div class="content"><span class="eyebrow">VIABILIDADE ESTIMADA</span><h2>Uma proposta em fase de <span>aperfeiçoamento</span></h2><p>Foi elaborado um levantamento de materiais para o protótipo, totalizando <strong>R$ 684,00</strong> no resumo expandido. Foram incluídos reservatórios, bombas, elementos filtrantes, membrana e conexões.</p><p>Foi realizada uma comparação entre a proposta educacional e sistemas comunitários, como os do Programa Água Doce. Também foram consideradas alternativas futuras para alimentação elétrica e manutenção.</p></div><div class="panel"><h3>Leia o resumo expandido</h3><p>Documento de estudo e apresentação do InovaEDU 2026, com contextualização, funcionamento e planejamento do protótipo.</p><a class="btn primary" href="resumo-expandido-inovaedu.pdf" download="Resumo-Expandido-InovaEDU-2026.pdf">Baixar resumo em PDF ↓</a><p><a href="resumo-expandido-inovaedu.pdf" target="_blank" rel="noopener">Abrir o resumo no navegador ↗</a></p></div></div></section>`},
 contato:{title:'Vamos conversar sobre <span>ciência e inovação?</span>',desc:'Contato e informações sobre a pesquisa científica em andamento.',kicker:'FALE COM A EQUIPE',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">PESQUISA CIENTÍFICA EM ANDAMENTO</span><h2>O Poder da Dessalinização no <span>Futuro Hídrico de Alagoas</span></h2><p>Pesquisa iniciada na Escola Estadual Dr. Sidrônio Augusto de Santa Maria, em Santa Luzia do Norte (AL). Foram realizados estudos, apresentações didáticas e testes sobre dessalinização.</p><div class="note">Preencha os campos para testar a interface. O formulário ainda não envia mensagens nem armazena informações.</div></div><form class="form" id="contactForm"><label>Nome<input name="nome" placeholder="Seu nome" required></label><label>E-mail<input name="email" type="email" placeholder="voce@exemplo.com" required></label><label>Assunto<select required><option value="">Selecione um assunto</option><option>Dúvidas sobre o projeto</option><option>Parceria ou colaboração</option><option>Informações sobre a pesquisa</option><option>Outro assunto</option></select></label><label>Mensagem<textarea placeholder="Escreva sua mensagem..." required></textarea></label><button class="btn primary" type="submit">Testar formulário ↗</button><p class="status" id="formStatus" aria-live="polite"></p></form></div></section>`}
