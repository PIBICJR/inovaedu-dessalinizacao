<script>
const pages={
 inicio:{title:'O Poder da Dessalinização no <span>Futuro Hídrico de Alagoas</span>',desc:'Uma pesquisa que transforma um desafio local em objeto de estudo científico e investiga como ciência e tecnologia podem contribuir para soluções relacionadas à água.',kicker:'INOVAEDU • CIÊNCIA NA ESCOLA PÚBLICA',body:`<section class="section"><div class="container"><div class="section-head center"><span class="eyebrow">CONHEÇA A PESQUISA</span><h2>Da realidade local à <span>investigação científica</span></h2><p>O projeto nasceu na Escola Estadual Dr. Sidrônio Augusto de Santa Maria, em Santa Luzia do Norte (AL), como parte de uma pesquisa científica em desenvolvimento contínuo.</p></div><div class="cards"><a class="card reveal" href="#origem"><div class="icon">🏫</div><h3>A origem do projeto</h3><p>Entenda como uma questão presente na comunidade motivou os estudantes a pesquisar alternativas.</p></a><a class="card reveal" href="#objetivo"><div class="icon">🎯</div><h3>Objetivo da pesquisa</h3><p>Conheça a proposta de estudar a dessalinização para diferentes realidades hídricas de Alagoas.</p></a><a class="card reveal" href="#prototipo"><div class="icon">⚙️</div><h3>Protótipo experimental</h3><p>Veja as etapas integradas que compõem o modelo de pesquisa em escala reduzida.</p></a></div></div></section><section class="section soft"><div class="container two"><div class="content"><span class="eyebrow">UMA PESQUISA EM CONSTRUÇÃO</span><h2>Aprender também é <span>testar, avaliar e melhorar.</span></h2><p>O protótipo encontra-se em fase de testes e aprimoramento laboratorial. Os desafios encontrados durante a montagem fazem parte do processo de aprendizagem sobre engenharia e dessalinização.</p><a class="btn primary" href="#testes">Acompanhe o estágio atual ↗</a></div><div class="panel"><span class="symbol">🔬</span><h3>Conhecimento que nasce na escola pública de Alagoas.</h3><p>Uma iniciativa estudantil para pesquisar, experimentar e desenvolver novas possibilidades.</p></div></div></section><section class="section"><div class="container band"><div><h2>O próximo passo é continuar pesquisando.</h2><p>Explore as páginas para conhecer a proposta, o protótipo, os testes e os planos futuros.</p></div><a class="btn primary" href="#futuro">Veja os próximos passos ↗</a></div></section>`},
 origem:{title:'A origem do <span>projeto</span>',desc:'Uma questão da realidade local se transformou em ponto de partida para uma investigação científica desenvolvida por estudantes.',kicker:'COMO TUDO COMEÇOU',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">O CONTEXTO</span><h2>Da sala de aula para a <span>pesquisa científica.</span></h2><p>O projeto “O Poder da Dessalinização no Futuro Hídrico de Alagoas” nasceu nas salas de aula e nos laboratórios da Escola Estadual Dr. Sidrônio Augusto de Santa Maria, localizada no município de Santa Luzia do Norte (AL), como parte de uma pesquisa científica em desenvolvimento contínuo.</p><p>Desenvolvido por estudantes engajados no ensino público e no bem-estar popular, o trabalho surgiu a partir da busca por soluções inovadoras para enfrentar a escassez e a instabilidade no abastecimento de água potável que afetam a comunidade escolar e a rotina da cidade.</p><p>Diante desse cenário, os estudantes decidiram transformar um problema local em objeto de estudo científico, investigando como a ciência e a tecnologia podem atuar como ferramentas de transformação social e sustentabilidade.</p></div><div class="panel"><span class="symbol">🏫</span><h3>Uma ideia que começou na escola pública.</h3><p>Escola Estadual Dr. Sidrônio Augusto de Santa Maria<br>Santa Luzia do Norte — Alagoas</p></div></div></section><section class="section soft"><div class="container"><div class="section-head"><span class="eyebrow">NOSSA MOTIVAÇÃO</span><h2>Transformar um desafio em <span>pergunta de pesquisa.</span></h2><p>A pesquisa parte da curiosidade científica e da intenção de compreender como uma tecnologia de grande escala pode ser estudada em uma versão experimental reduzida.</p></div><div class="cards"><article class="card"><div class="icon">🔎</div><h3>Observar</h3><p>Reconhecer um desafio relacionado à escassez e à instabilidade do abastecimento de água.</p></article><article class="card"><div class="icon">📚</div><h3>Investigar</h3><p>Estudar tecnologias de dessalinização e compreender seus princípios de funcionamento.</p></article><article class="card"><div class="icon">🧪</div><h3>Experimentar</h3><p>Construir um protótipo em escala reduzida para apoiar a aprendizagem e a pesquisa.</p></article></div></div></section>`},
 objetivo:{title:'Por que estudar a <span>dessalinização?</span>',desc:'Objetivo da pesquisa: investigar a dessalinização como possível alternativa estratégica para o futuro hídrico de Alagoas.',kicker:'DEMOCRATIZANDO A CIÊNCIA DO FUTURO',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">OBJETIVO PRINCIPAL</span><h2>Estudar uma tecnologia e aproximá-la da <span>realidade local.</span></h2><p>O objetivo principal é demonstrar a viabilidade e a importância da dessalinização como alternativa estratégica para o futuro hídrico do estado de Alagoas, seja no atendimento a poços salobros no interior ou às demandas litorâneas.</p><p>Para isso, a equipe estudou grandes usinas de dessalinização globais e levantou uma questão: como trazer essa tecnologia para a realidade local?</p><p>Enquanto grandes plantas industriais exigem investimentos elevados e estruturas complexas, o projeto desenvolveu uma resposta experimental em escala reduzida para fins de pesquisa escolar.</p></div><div class="panel"><span class="symbol">🎯</span><h3>Ciência acessível, pesquisa aplicada e inovação.</h3><p>O protótipo reduzido permite estudar conceitos e desafios técnicos, sem representar uma usina industrial.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head center"><span class="eyebrow">FOCO DA INVESTIGAÇÃO</span><h2>O que o projeto pretende <span>explorar?</span></h2></div><div class="cards"><article class="card"><div class="icon">🌊</div><h3>Contextos de aplicação</h3><p>Considerar água salobra de poços no interior e necessidades de regiões litorâneas, conforme o texto da pesquisa.</p></article><article class="card"><div class="icon">⚙️</div><h3>Escala reduzida</h3><p>Estudar os princípios de tratamento e separação por meio de um protótipo experimental.</p></article><article class="card"><div class="icon">💡</div><h3>Inovação própria</h3><p>Investigar materiais alternativos e possibilidades para desenvolver uma membrana própria no futuro.</p></article></div><div class="note"><strong>Importante:</strong> a viabilidade para uso real depende de resultados experimentais, análise da qualidade da água, custos, consumo energético, manutenção e avaliação ambiental.</div></div></section>`},
 prototipo:{title:'Conheça o <span>protótipo experimental</span>',desc:'Etapas descritas para o protótipo experimental de dessalinização.',kicker:'DA TEORIA À EXPERIMENTAÇÃO',body:`<section class="section"><div class="container"><div class="section-head"><span class="eyebrow">ETAPAS INTEGRADAS</span><h2>Como o sistema foi <span>planejado?</span></h2><p>De acordo com o documento do projeto, o sistema reúne pré-tratamento físico e adsortivo e uma etapa de separação por osmose reversa.</p></div><div class="steps"><article class="step"><span class="num">01</span><div><h3>Pré-tratamento físico e adsortivo</h3><p>A água bruta, descrita no projeto como captada de poços salobros, é bombeada por um sistema de baixo consumo energético através de filtros em série compostos por areia, brita, algodão e carvão ativado.</p></div></article><article class="step"><span class="num">02</span><div><h3>Função do carvão ativado</h3><p>Segundo o texto do projeto, o carvão ativado atua por adsorção, ajudando a remover impurezas, odores e compostos orgânicos, além de proteger os componentes seguintes.</p></div></article><article class="step"><span class="num">03</span><div><h3>Separação por osmose reversa</h3><p>Após o pré-tratamento, a água é submetida a pressão controlada para atravessar uma membrana semipermeável, que retém grande parte dos sais dissolvidos.</p></div></article><article class="step"><span class="num">04</span><div><h3>Estudo e observação</h3><p>A equipe acompanha o funcionamento do protótipo e investiga os desafios hidráulicos e de calibração de pressão encontrados durante os testes.</p></div></article></div><div class="note"><strong>Nota técnica:</strong> a filtragem com areia, brita, algodão e carvão ativado não remove, por si só, os sais dissolvidos. A dessalinização depende da etapa apropriada de separação. Água produzida por um protótipo não deve ser considerada potável sem análises laboratoriais e tratamento validado.</div></div></section><section class="section soft"><div class="container two"><div class="panel"><span class="symbol">🧪</span><h3>Um protótipo para aprender com os desafios reais da engenharia.</h3><p>Modelo experimental em fase de testes e aprimoramento laboratorial.</p></div><div class="content"><span class="eyebrow">PESQUISA EM ANDAMENTO</span><h2>O protótipo é parte do <span>processo de aprendizagem.</span></h2><p>O desenvolvimento em escala reduzida permite à equipe estudar o comportamento das etapas, identificar limitações e planejar melhorias com base em observações e testes.</p><a class="btn primary" href="#testes">Ver estágio atual ↗</a></div></div></section>`},
 testes:{title:'Um projeto em <span>fase de testes</span>',desc:'Estágio atual, desafios técnicos e aprimoramento do protótipo.',kicker:'TRANSPARÊNCIA CIENTÍFICA',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">ESTÁGIO ATUAL</span><h2>Testar, compreender e <span>aprimorar.</span></h2><p>O projeto está em fase de testes e aprimoramento laboratorial. Durante a montagem e os primeiros testes do protótipo, a equipe enfrentou desafios práticos relacionados à dinâmica hidráulica e à calibração das pressões entre as etapas de filtragem.</p><p>Lidar com essas barreiras técnicas proporcionou aprendizado sobre os desafios reais da engenharia de dessalinização.</p><p>Como se trata de um projeto em desenvolvimento, os resultados e as melhorias devem ser registrados conforme novos testes forem realizados.</p></div><div class="panel"><span class="symbol">🔬</span><h3>O resultado de um teste também é conhecimento.</h3><p>Observar limitações ajuda a orientar os próximos passos da pesquisa.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head center"><span class="eyebrow">PONTOS DE ATENÇÃO IDENTIFICADOS</span><h2>Desafios técnicos em <span>investigação</span></h2><p>Os pontos abaixo foram mencionados no texto de apresentação do projeto.</p></div><div class="cards"><article class="card"><div class="icon">〰️</div><h3>Dinâmica hidráulica</h3><p>Observar como a água percorre as etapas do sistema e identificar possíveis limitações no fluxo.</p></article><article class="card"><div class="icon">🎚️</div><h3>Calibração das pressões</h3><p>Ajustar e estudar as pressões entre as etapas de filtragem e o funcionamento da membrana.</p></article><article class="card"><div class="icon">📝</div><h3>Registro dos testes</h3><p>Documentar as condições, observações e resultados reais à medida que a equipe avançar.</p></article></div><div class="note"><strong>Espaço para futuras atualizações:</strong> adicione aqui datas dos testes, fotografias do protótipo, medições, tabelas de resultados e conclusões confirmadas pela equipe.</div></div></section>`},
 futuro:{title:'O futuro da pesquisa <span>continua em construção.</span>',desc:'Perspectivas futuras do projeto de dessalinização.',kicker:'NOSSA PRÓXIMA FRONTEIRA',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">PLANOS FUTUROS</span><h2>Pesquisar novas possibilidades com <span>autonomia tecnológica.</span></h2><p>O documento do projeto apresenta como perspectiva o estudo e o planejamento de uma membrana própria de osmose reversa, utilizando materiais alternativos, polímeros acessíveis e técnicas artesanais de fabricação.</p><p>A intenção é investigar maneiras de reduzir os custos de produção e aumentar a autonomia tecnológica do projeto.</p><p>Essa etapa é uma proposta futura de pesquisa, ainda não um resultado comprovado. Seu desenvolvimento exigirá testes técnicos, avaliação de desempenho e verificação da qualidade da água obtida.</p></div><div class="panel"><span class="symbol">🚀</span><h3>Inovação científica que pode nascer na escola pública.</h3><p>Uma meta de pesquisa que precisa ser desenvolvida e validada por meio de experimentos.</p></div></div></section><section class="section soft"><div class="container"><div class="section-head"><span class="eyebrow">CAMINHOS DE INVESTIGAÇÃO</span><h2>O que pode ser desenvolvido <span>nas próximas etapas?</span></h2><p>Possíveis áreas para documentar o progresso da pesquisa, conforme o trabalho avançar.</p></div><div class="steps"><article class="step"><span class="num">01</span><div><h3>Pesquisa de materiais</h3><p>Estudar polímeros e materiais alternativos que possam ser avaliados em experimentos controlados.</p></div></article><article class="step"><span class="num">02</span><div><h3>Desenvolvimento experimental</h3><p>Planejar e documentar a fabricação de amostras e os procedimentos de teste.</p></div></article><article class="step"><span class="num">03</span><div><h3>Avaliação de desempenho</h3><p>Comparar resultados de forma controlada, incluindo passagem de água, retenção de sais e durabilidade.</p></div></article><article class="step"><span class="num">04</span><div><h3>Viabilidade e segurança</h3><p>Avaliar custos, consumo de energia, manutenção, impacto ambiental e qualidade da água.</p></div></article></div><div class="note"><strong>Próxima atualização:</strong> adicione aqui os resultados reais quando houver novos testes, fotografias, dados e conclusões validadas pela equipe.</div></div></section>`},
 contato:{title:'Vamos conversar sobre <span>ciência e inovação?</span>',desc:'Contato e formulário demonstrativo do projeto INOVAEDU.',kicker:'FALE COM A EQUIPE',body:`<section class="section"><div class="container two"><div class="content"><span class="eyebrow">INOVAEDU • PROJETO CIENTÍFICO</span><h2>O Poder da Dessalinização no <span>Futuro Hídrico de Alagoas</span></h2><p>Projeto desenvolvido por estudantes da Escola Estadual Dr. Sidrônio Augusto de Santa Maria, em Santa Luzia do Norte (AL), para investigação científica e apresentação na XI Mostra Científica.</p><div class="note">Preencha os campos para testar a interface. O formulário ainda não envia mensagens nem armazena informações.</div></div><form class="form" id="contactForm"><label>Nome<input name="nome" placeholder="Seu nome" required></label><label>E-mail<input name="email" type="email" placeholder="voce@exemplo.com" required></label><label>Assunto<select required><option value="">Selecione um assunto</option><option>Dúvidas sobre o projeto</option><option>Parceria ou colaboração</option><option>Informações sobre a pesquisa</option><option>Outro assunto</option></select></label><label>Mensagem<textarea placeholder="Escreva sua mensagem..." required></textarea></label><button class="btn primary" type="submit">Testar formulário ↗</button><p class="status" id="formStatus" aria-live="polite"></p></form></div></section>`}

function render(){let key=location.hash.slice(1)||'inicio';if(key==='contact')key='contato';if(!pages[key])key='inicio';const p=pages[key];document.title=(key==='inicio'?'INOVAEDU':p.title.replace(/<[^>]+>/g,''))+' | INOVAEDU';const links=nav.map(([k,n])=>`<a href="#${k}" class="${k===key?'active':''}">${n}</a>`).join('');document.querySelector('#app').innerHTML=`<header class="header"><div class="container nav"><a class="brand" href="#inicio"><span class="brand-icon">💧</span><span>INOVA<span style="color:var(--aqua)">EDU</span><small>PROJETO CIENTÍFICO</small></span></a><button class="toggle" id="toggle" aria-expanded="false" aria-label="Abrir menu">☰</button><nav class="links" id="links">${links}<a class="cta ${key==='contato'?'active':''}" href="#contato">Contato ↗</a></nav></div></header>${key==='inicio'?`<main><section class="hero"><div class="container hero-grid"><div><span class="eyebrow">${p.kicker}</span><h1>${p.title}</h1><p>${p.desc}</p><div class="actions"><a class="btn primary" href="#origem">Conheça o projeto ↗</a><a class="btn outline" href="#prototipo">Explore o protótipo</a></div></div><div class="orb-wrap"><div class="orb"></div><div class="drop">💧</div><div class="orb-label"><strong>Pesquisa • Tecnologia • Sustentabilidade</strong>Uma proposta em desenvolvimento em Alagoas</div></div></div></section>${p.body}</main>`:`<main><section class="pagehead"><div class="container"><div class="crumb"><a href="#inicio">INÍCIO</a> / ${key.toUpperCase()}</div><span class="eyebrow">${p.kicker}</span><h1>${p.title}</h1><p>${p.desc}</p></div></section>${p.body}</main>`}<footer class="footer"><div class="container"><div class="footer-top"><a class="brand" href="#inicio"><span class="brand-icon">💧</span><span>INOVA<span style="color:var(--aqua)">EDU</span><small>ALAGOAS • PROJETO CIENTÍFICO</small></span></a><p>O Poder da Dessalinização no Futuro Hídrico de Alagoas</p></div><div class="footer-bottom"><span>© ${new Date().getFullYear()} • Projeto científico em desenvolvimento contínuo.</span><span>Escola Estadual Dr. Sidrônio Augusto de Santa Maria • Santa Luzia do Norte – AL</span></div></div></footer>`;const toggle=document.querySelector('#toggle'),linksEl=document.querySelector('#links');toggle.addEventListener('click',()=>{let open=linksEl.classList.toggle('open');toggle.textContent=open?'✕':'☰';toggle.setAttribute('aria-expanded',String(open))});linksEl.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{linksEl.classList.remove('open');toggle.textContent='☰';toggle.setAttribute('aria-expanded','false')}));const observer=('IntersectionObserver'in window)?new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');observer.unobserve(e.target)}}),{threshold:.1}):null;document.querySelectorAll('.reveal').forEach(el=>observer?observer.observe(el):el.classList.add('visible'));const form=document.querySelector('#contactForm');if(form)form.addEventListener('submit',e=>{e.preventDefault();document.querySelector('#formStatus').textContent='Formulário de demonstração testado! Nenhuma mensagem foi enviada.';form.reset()});window.scrollTo(0,0)}

function replaceEmojiIcons(){const root=document.querySelector('#app');if(!root)return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())if(Object.keys(iconMap).some(e=>walker.currentNode.nodeValue.includes(e)))nodes.push(walker.currentNode);nodes.forEach(node=>{const span=document.createElement('span');span.innerHTML=node.nodeValue;for(const [emoji,name] of Object.entries(iconMap)){span.innerHTML=span.innerHTML.split(emoji).join(`<svg class="line-icon" role="img" aria-label="${name}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${iconPaths[name]}</svg>`)}node.parentNode.replaceChild(span,node)});}

const originalRender=render;render=function(){originalRender();replaceEmojiIcons()};window.addEventListener('hashchange',render);render();
